# This rule is not used by the project napwake itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to napwake.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.
# It's aggregated into the built-in view, edit and admin roles, so whoever
# can view a namespace can see its ManagedWorkloads, as kubectl napwake
# status and scan do.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: napwake
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
  name: managedworkload-viewer-role
rules:
- apiGroups:
  - napwake.dev
  resources:
  - managedworkloads
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - napwake.dev
  resources:
  - managedworkloads/status
  verbs:
  - get
