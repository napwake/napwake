# Holds the doorman's ServiceAccount to the two annotations that record a
# request on ManagedWorkloads, and the one that counts the requests it
# turned away, though its role may patch them, as the Helm
# chart's doorman.admissionPolicy does. A username is a string no
# transformer rewrites, so the policy takes the doorman's ServiceAccount as
# its parameter and the binding names it, through kustomizeconfig, as it
# names the policy: both follow any namespace and name prefix, set here in
# config/default or in an overlay on top of it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: doorman
  labels:
    app.kubernetes.io/name: napwake
    app.kubernetes.io/managed-by: kustomize
    control-plane: doorman
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ServiceAccount
  matchConstraints:
    resourceRules:
      - apiGroups: [napwake.dev]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [managedworkloads]
  matchConditions:
    - name: doorman
      expression: request.userInfo.username == "system:serviceaccount:" + params.metadata.namespace + ":" + params.metadata.name
  variables:
    - name: allowed
      expression: "['napwake.dev/last-request', 'napwake.dev/last-request-from', 'napwake.dev/turned-away']"
    - name: annotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: oldAnnotations
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
  validations:
    - expression: object.spec == oldObject.spec
      message: The doorman may not change a ManagedWorkload's spec.
    - expression: >-
        variables.annotations.all(k, k in variables.allowed
          || (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.annotations[k]))
        && variables.oldAnnotations.all(k, k in variables.allowed || k in variables.annotations)
      message: The doorman may only set the napwake.dev/last-request, napwake.dev/last-request-from and napwake.dev/turned-away annotations.
    - expression: >-
        (has(object.metadata.labels) ? object.metadata.labels : {})
        == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})
      message: The doorman may not change a ManagedWorkload's labels.
    - expression: >-
        (has(object.metadata.finalizers) ? object.metadata.finalizers : [])
        == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : [])
      message: The doorman may not change a ManagedWorkload's finalizers.
    - expression: >-
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : [])
        == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : [])
      message: The doorman may not change a ManagedWorkload's owners.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: doorman
  labels:
    app.kubernetes.io/name: napwake
    app.kubernetes.io/managed-by: kustomize
    control-plane: doorman
spec:
  policyName: doorman
  # Without its ServiceAccount there's no doorman to hold back, and Deny
  # would refuse every update to every ManagedWorkload, the operator's too.
  paramRef:
    name: doorman
    namespace: system
    parameterNotFoundAction: Allow
  validationActions: [Deny]
