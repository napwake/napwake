apiVersion: napwake.dev/v1alpha1
kind: ManagedWorkload
metadata:
  labels:
    app.kubernetes.io/name: napwake
    app.kubernetes.io/managed-by: kustomize
  name: managedworkload-sample
  namespace: staging
spec:
  target:
    kind: Deployment
    name: api-server
  idlePolicy:
    idleAfter: 1h
    autoResume: true
  prediction:
    mode: balanced
  dryRun: true
