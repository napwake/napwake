site_name: Hybernate
site_description: Intelligent Kubernetes workload lifecycle management
site_url: https://okedeji.io/hybernate/
repo_url: https://github.com/okedeji/hybernate
repo_name: okedeji/hybernate
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: white
    accent: black
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.action.edit
  favicon: assets/favicon.svg
  icon:
    logo: material/snowflake
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/custom.css

plugins:
  - search
  # Each release's docs are a version of the site, published by
  # hack/docsite. Aliases are copies, which any static host serves, and
  # every version's canonical URL is latest's, so search engines send
  # readers to the current release.
  - mike:
      alias_type: copy
      canonical_version: latest

extra:
  version:
    provider: mike
    default: latest
    alias: true
  # The release a version documents, such as 0.2.0-rc.1, which
  # overrides/main.html names in the banner of every version but latest.
  release: !ENV [HYBERNATE_DOCS_RELEASE, ""]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - kubectl Plugin: getting-started/kubectl-plugin.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Lifecycle: concepts/lifecycle.md
      - Forecasting: concepts/forecasting.md
      - Idle Detection: concepts/idle-detection.md
      - Dependencies: concepts/dependencies.md
      - Wake on Request: concepts/wake-on-request.md
      - Cost Tracking: concepts/cost-tracking.md
  - Guides:
      - Opting In: guides/opt-in.md
      - Public Preview Environments: guides/preview-environments.md
      - ManagedWorkload: guides/managed-workload.md
      - Pause and Resume: guides/pause.md
      - Cluster Autoscaler: guides/cluster-autoscaler.md
      - Node Pools for Real Savings: guides/node-pools.md
      - Dry Run: guides/dry-run.md
      - Prometheus Activity: guides/prometheus-signals.md
      - GitOps tools: guides/gitops.md
      - HPA and KEDA: guides/autoscalers.md
  - Reference:
      - API: reference/api.md
      - Helm Values: reference/helm-values.md
      - Metrics: reference/metrics.md
      - Labels & Annotations: reference/labels-annotations.md
      - Data and Access: reference/data-and-access.md
      - Security: reference/security.md
      - Configuration: reference/configuration.md
      - Compatibility: reference/compatibility.md
  - Operations:
      - Monitoring: operations/monitoring.md
      - Troubleshooting: operations/troubleshooting.md
      - Upgrading: operations/upgrading.md
  - Contributing: contributing.md
