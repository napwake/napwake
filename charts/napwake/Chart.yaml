apiVersion: v2
name: napwake
description: Kubernetes operator that pauses idle workloads and wakes them when used — idle detection, wake on request, forecasting, and cost tracking.
type: application
version: 0.2.0
appVersion: "v0.2.0"
kubeVersion: ">=1.30.0-0"
home: https://napwake.dev
sources:
  - https://github.com/napwake/napwake
maintainers:
  - name: Tobi Okedeji
keywords:
  - kubernetes
  - operator
  - idle-detection
  - scaling
  - cost-optimization
  - lifecycle
# Artifact Hub reads these. make bump keeps the image's tag and prerelease
# with the chart's version, and verify-version holds them to it.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: napwake
      image: ghcr.io/napwake/napwake:v0.2.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/crds: |
    - kind: ManagedWorkload
      version: v1alpha1
      name: managedworkloads.napwake.dev
      displayName: ManagedWorkload
      description: One workload Napwake manages, its settings, and what Napwake is doing with it.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.napwake.dev
    - name: Questions
      url: https://github.com/napwake/napwake/discussions
