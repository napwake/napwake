apiVersion: v2
name: napwake
description: Pauses idle Kubernetes workloads in staging, preview and dev, and wakes them on the first request.
type: application
version: 0.2.0-rc.11
appVersion: "v0.2.0-rc.11"
kubeVersion: ">=1.30.0-0"
home: https://napwake.dev
icon: https://raw.githubusercontent.com/napwake/brand/main/logo/symbol.svg
sources:
  - https://github.com/napwake/napwake
maintainers:
  - name: The Napwake Authors
    url: https://github.com/napwake/napwake
keywords:
  - kubernetes
  - operator
  - idle
  - staging
  - preview-environments
  - non-production
  - wake-on-request
  - cost
# Artifact Hub reads these. make bump keeps the image's tag and prerelease
# with the chart's version, and verify-version holds them to it.
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "true"
  artifacthub.io/images: |
    - name: napwake
      image: ghcr.io/napwake/napwake:v0.2.0-rc.11
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/crds: |
    - kind: ManagedWorkload
      version: v1alpha1
      name: managedworkloads.napwake.dev
      displayName: ManagedWorkload
      description: One workload Napwake manages, its settings, and what Napwake is doing with it.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.napwake.dev
    - name: Questions
      url: https://github.com/napwake/napwake/discussions
