{{- include "napwake.defaults" . -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "napwake.fullname" . }}-manager
  labels:
    {{- include "napwake.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "napwake.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "napwake.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
