{{- include "napwake.defaults" . -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "napwake.fullname" . }}-manager
  labels:
    {{- include "napwake.labels" . | nindent 4 }}
rules:
  {{- include "napwake.managerClusterRules" . | nindent 2 }}
  {{- if not .Values.watchNamespaces }}
  {{- include "napwake.managerRules" . | nindent 2 }}
  {{- end }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "napwake.fullname" $ }}-manager
  namespace: {{ . }}
  labels:
    {{- include "napwake.labels" $ | nindent 4 }}
rules:
  {{- include "napwake.managerRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "napwake.fullname" $ }}-manager
  namespace: {{ . }}
  labels:
    {{- include "napwake.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "napwake.fullname" $ }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "napwake.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if and .Values.watchNamespaces .Values.doorman.enabled }}
---
{{- /*
The operator finds the Ready doorman pods through the doorman Service's
EndpointSlices, here in the release namespace, which needn't be watched.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "napwake.fullname" . }}-doorman-endpoints
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "napwake.labels" . | nindent 4 }}
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "napwake.fullname" . }}-doorman-endpoints
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "napwake.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "napwake.fullname" . }}-doorman-endpoints
subjects:
  - kind: ServiceAccount
    name: {{ include "napwake.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
