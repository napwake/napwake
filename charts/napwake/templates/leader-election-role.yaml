{{- include "napwake.defaults" . -}}
{{- if .Values.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "napwake.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "napwake.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "napwake.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "napwake.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "napwake.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "napwake.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
