{{- include "napwake.defaults" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "napwake.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "napwake.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if not .Values.leaderElection.enabled }}
  {{- /*
  Without a lease, a rolling update's surge pod would act alongside the
  old one.
  */}}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "napwake.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- merge (dict "kubectl.kubernetes.io/default-container" "manager") .Values.podAnnotations | toYaml | nindent 8 }}
      labels:
        {{- merge (include "napwake.selectorLabels" . | fromYaml) .Values.podLabels | toYaml | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "napwake.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- /*
      The manager's 30s for running reconciles to finish, which then
      releases the lease, with room to exit before SIGKILL.
      */}}
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "napwake.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/manager]
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:8081
            {{- if .Values.metrics.enabled }}
            - {{ printf "--metrics-bind-address=:%v" .Values.metrics.port | quote }}
            - {{ printf "--metrics-secure=%v" .Values.metrics.secure | quote }}
            {{- end }}
            - {{ printf "--zap-log-level=%v" .Values.logLevel | quote }}
            - {{ printf "--zap-encoder=%v" .Values.logEncoder | quote }}
            - {{ printf "--max-concurrent-reconciles=%v" .Values.maxConcurrentReconciles | quote }}
            - {{ printf "--timezone=%v" .Values.timezone | quote }}
            {{- with .Values.watchNamespaces }}
            - {{ printf "--watch-namespaces=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .Values.protectedNamespaces }}
            - {{ printf "--protected-namespaces=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .Values.prometheus.url }}
            - {{ printf "--prometheus-url=%v" . | quote }}
            {{- end }}
            {{- with .Values.prometheus.selector }}
            {{- if not $.Values.prometheus.url }}
            {{- fail "prometheus.selector narrows the queries made of prometheus.url, which isn't set" }}
            {{- end }}
            - {{ printf "--prometheus-selector=%v" . | quote }}
            {{- end }}
            - {{ printf "--default-idle-after=%v" .Values.defaults.idleAfter | quote }}
            - {{ printf "--default-cpu-threshold=%v" .Values.defaults.cpuThreshold | quote }}
            - {{ printf "--default-dry-run=%v" .Values.defaults.dryRun | quote }}
            - {{ printf "--default-pause-early=%v" .Values.defaults.pauseEarly | quote }}
            - {{ printf "--default-forecast=%v" .Values.defaults.forecast | quote }}
            - {{ printf "--default-wake=%v" .Values.defaults.wake | quote }}
            {{- if not .Values.pausing.enabled }}
            - --pausing=false
            {{- end }}
            - {{ printf "--doorman-service=%s" (ternary (include "napwake.doormanName" .) "" .Values.doorman.enabled) | quote }}
            - {{ printf "--doorman-ports-per-workload=%v" .Values.doorman.portsPerWorkload | quote }}
            - {{ printf "--doorman-ports-per-namespace=%v" .Values.doorman.portsPerNamespace | quote }}
            {{- with .Values.doorman.negForwarder }}
            {{- if .enabled }}
            - --neg-forwarder
            - {{ printf "--neg-forwarder-image=%s" (include "napwake.image" $) | quote }}
            - {{ printf "--neg-forwarder-replicas=%v" .replicas | quote }}
            - {{ printf "--neg-forwarder-resources=%s" (toJson .resources) | quote }}
            - {{ printf "--neg-forwarder-doorman-service=%s" (include "napwake.doormanPodsName" $) | quote }}
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            - name: probes
              containerPort: 8081
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
