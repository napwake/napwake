{{- if .Values.uninstallGuard.enabled }}
{{- /*
A pre-delete hook that refuses helm uninstall while ManagedWorkloads
remain: without the operator, their finalizers never run, their workloads
stay at 0 replicas, and their Services keep routing to the deleted
doorman. The kubectl image has no shell, so one container per scope prints
what's left and why, and another fails the Job if any outlives the wait,
which gives the operator time to restore ManagedWorkloads being deleted.
Helm prints both containers' logs when the hook fails.
*/}}
{{- $name := include "hybernate.uninstallGuardName" . }}
{{- $scopes := .Values.watchNamespaces | default (list "") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.uninstallGuardLabels" . | nindent 4 }}
{{- if .Values.watchNamespaces }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "hybernate.labels" $ | nindent 4 }}
rules:
  - apiGroups: [hybernate.io]
    resources: [managedworkloads]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "hybernate.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "hybernate.uninstallGuardLabels" . | nindent 4 }}
rules:
  - apiGroups: [hybernate.io]
    resources: [managedworkloads]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "hybernate.uninstallGuardLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.uninstallGuardLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-output-log-policy: hook-failed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  # A refused uninstall leaves the Job for kubectl logs, until then.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "hybernate.uninstallGuardLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- range $i, $ns := $scopes }}
        {{- $suffix := ternary "" (printf "-%d" $i) (eq $ns "") }}
        {{- $scope := ternary (list "--all-namespaces") (list "--namespace" $ns) (eq $ns "") }}
        - name: explain{{ $suffix }}
          image: {{ include "hybernate.uninstallGuardImage" $ }}
          imagePullPolicy: IfNotPresent
          args:
            - get
            - managedworkloads.hybernate.io
            {{- range $scope }}
            - {{ . | quote }}
            {{- end }}
            - --output
            - |-
              go-template={{ `{{- $left := false -}}{{- $stuck := false -}}
              {{- range .items -}}{{- if .metadata.deletionTimestamp -}}{{- $stuck = true -}}{{- else -}}{{- $left = true -}}{{- end -}}{{- end -}}
              {{- if $stuck -}}
              These ManagedWorkloads are being deleted, but the operator hasn't finished letting go of
              their workloads. If it isn't running, nothing will: uninstall with --no-hooks and restore
              the workloads by hand, as https://okedeji.io/hybernate/getting-started/installation/#uninstall says:
              {{ range .items }}{{ if .metadata.deletionTimestamp }}  {{ .metadata.namespace }}/{{ .metadata.name }}
              {{ end }}{{ end }}
              {{ end -}}
              {{- if $left -}}
              Hybernate refuses to uninstall while it manages workloads. Without the operator, these
              ManagedWorkloads' workloads would stay paused at 0 replicas, with their Services still
              routed to the doorman being deleted:
              {{ range .items }}{{ if not .metadata.deletionTimestamp }}  {{ .metadata.namespace }}/{{ .metadata.name }}
              {{ end }}{{ end }}
              Stop managing them first, while the operator runs, so it scales each one back up:
                1. Remove the hybernate.io/managed label from these workloads and their namespaces.
                2. Delete the ManagedWorkloads you created yourself:
                     kubectl delete managedworkloads --all --all-namespaces
              Then uninstall again: helm uninstall, or delete the Argo CD Application. To uninstall
              anyway, and restore the workloads by hand, see
              https://okedeji.io/hybernate/getting-started/installation/#uninstall
              {{ end -}}` }}
          env:
            - name: HOME
              value: /home/kubectl
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $.Values.uninstallGuard.resources | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /home/kubectl
        - name: wait{{ $suffix }}
          image: {{ include "hybernate.uninstallGuardImage" $ }}
          imagePullPolicy: IfNotPresent
          args:
            - wait
            - --for=delete
            - managedworkloads.hybernate.io
            - --all
            {{- range $scope }}
            - {{ . | quote }}
            {{- end }}
            - --timeout=60s
          env:
            - name: HOME
              value: /home/kubectl
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $.Values.uninstallGuard.resources | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /home/kubectl
        {{- end }}
      volumes:
        - name: home
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
