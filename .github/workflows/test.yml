name: Tests

# Also on every push to main, so the README's Tests badge, which reads
# main's runs, shows main as it is.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-envtest
      - name: Running Tests
        run: make test

  generated:
    name: Generated files and go.mod
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Regenerates the CRDs, the chart's copy of them, RBAC and deepcopy
      # code, and fails if any differ from what's committed, if go.mod
      # and go.sum aren't tidy, or if the image or the devcontainer isn't
      # built with go.mod's toolchain.
      - run: make verify-generated

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      # Lints the chart, renders it for EKS-, GKE- and AKS-style versions,
      # checks it grants the operator what config/rbac/role.yaml does, and
      # that it refuses as it renders the upgrades its upgrade guard would.
      # With Helm 3, while helm-smoke installs with Helm 4 and 3.18, so the
      # chart is proven on both.
      - run: make check-chart
      - uses: ./.github/actions/setup-envtest
      - run: make test-doorman-policy

  alerts:
    name: Alert rules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - run: make test-alerts
