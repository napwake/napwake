name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The chart's version and appVersion, the kustomize image, the docs'
  # install and verify commands, and the changelog's date are committed with
  # the release (make release does it), so installing from the tagged source
  # gets the image the tag publishes. make verify-version refuses a tag that
  # isn't a version first, before any step puts it in a command.
  versions:
    name: Versions match the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TAG: ${{ github.ref_name }}
        run: make verify-version VERSION="${TAG#v}"

  # make release commits the version bump and tags it without a pull
  # request, so the tag gets every check a pull request does.
  test:
    name: Test
    needs: [versions]
    uses: ./.github/workflows/test.yml

  lint:
    name: Lint
    needs: [versions]
    uses: ./.github/workflows/lint.yml

  # Scanned before anything is pushed: once the release job tags the image,
  # users can pull it.
  security:
    name: Security
    needs: [versions]
    uses: ./.github/workflows/security.yml

  e2e:
    name: E2E
    needs: [versions]
    uses: ./.github/workflows/test-e2e.yml

  helm-smoke:
    name: Helm smoke
    needs: [versions]
    uses: ./.github/workflows/helm-smoke.yml

  # Everything that can fail is done before anything users install from
  # changes: the files are built, the image is pushed by digest alone, where
  # nothing pulls it, and signed, and the GitHub release is drafted with
  # every file. Only then is the image tagged, the chart pushed, latest
  # moved and the release published, so a failure leaves at most a draft
  # and an untagged image, and the workflow can be run again.
  release:
    name: Build and Release
    needs: [test, lint, security, e2e, helm-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub release
      packages: write # the image and chart in GHCR
      id-token: write # keyless signing
      attestations: write # build provenance
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # A pre-release, such as v0.3.0-rc.1, has a hyphen. It rehearses the
      # release: everything is published but latest, so it's installed only
      # by asking for it, and its docs are the site's next, not its latest.
      - name: Read the release's version
        id: version
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "chart=${TAG#v}" >> "$GITHUB_OUTPUT"

      # A pre-release's notes are those of the version it rehearses. The
      # notes link the release's docs: its minor's, or next's for a
      # pre-release. GitHub refuses notes over 125,000 characters, so a
      # longer section is cut at the last whole line that fits, and links
      # to the rest in the changelog at the tag.
      - name: Extract the changelog for the release
        run: |
          base="${TAG#v}"
          base="${base%%-*}"
          awk -v heading="## [${base}]" 'index($0, heading) == 1 {found = 1; next} /^## \[/ {if (found) exit} found' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md's section for ${base} is empty or missing" >&2
            exit 1
          fi
          if [ "$(wc -c < release-notes.md)" -gt 120000 ]; then
            head -c 120000 release-notes.md | sed '$d' > release-notes.cut
            mv release-notes.cut release-notes.md
            printf '\nThe list goes on in [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" "$TAG" >> release-notes.md
          fi
          docs="${base%.*}"
          if [[ "$TAG" == *-* ]]; then
            docs=next
          fi
          printf '\n**Docs for this release:** https://docs.napwake.dev/%s/\n' "$docs" >> release-notes.md

      # Static, so the Linux binaries run on Alpine and Amazon Linux as well
      # as glibc distributions. krew-index requires the LICENSE in each, and
      # NOTICE credits the price data the plugin embeds.
      - name: Build kubectl-napwake plugin binaries
        run: |
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${platform%/*}
            arch=${platform#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            bin=kubectl-napwake-${os}-${arch}${ext}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "$bin" ./cmd/kubectl-napwake
            tar czf "kubectl-napwake-${os}-${arch}.tar.gz" "$bin" LICENSE NOTICE
          done

      - name: Generate and validate the Krew manifest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p krew
          ./hack/krew-manifest.sh "$TAG" "$REPOSITORY" > krew/napwake.yaml
          # The release's archives aren't uploaded yet, so installing from
          # the manifest's URIs is left to krew-index's own checks.
          GOBIN="$PWD/krew" go install sigs.k8s.io/krew/cmd/validate-krew-manifest@v0.5.0
          ./krew/validate-krew-manifest -manifest krew/napwake.yaml -skip-install
          cp krew/napwake.yaml krew-napwake.yaml

      - name: Generate install manifest
        run: make build-installer IMG="${REGISTRY}/${IMAGE_NAME}:${TAG}"

      - name: Package the Helm chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
        run: helm package charts/napwake --version "$CHART_VERSION" --app-version "$TAG"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pushed by digest, untagged, so nothing pulls it until it's tagged.
      - name: Build and push the multi-arch image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: VERSION=${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records, an organization's artifact metadata, stay off
          # until the napwake organization has a use for them.
          create-storage-record: false

      - name: Sign the image, and attach an SBOM for each platform
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "$image"
          for platform in linux/amd64 linux/arm64; do
            sbom="sbom-${platform//\//-}.spdx.json"
            syft scan "registry:${image}" --platform "$platform" -o "spdx-json=${sbom}"
            cosign attest --yes --predicate "$sbom" --type spdxjson "$image"
          done

      # A report, not a gate: security.yml fails the release on fixable
      # vulnerabilities before this job runs, so a flaky download of Trivy's
      # database mustn't stop it here.
      - name: Report the amd64 image's vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          output: vulnerabilities-linux-amd64.txt
      - name: Report the arm64 image's vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          output: vulnerabilities-linux-arm64.txt

      # The release uploads each file under its base name, so they're hashed
      # from one directory: checksums.txt then names them as users download
      # them, and sha256sum --check finds each one beside it.
      - name: Collect the release files
        run: |
          mkdir release
          cp dist/install.yaml napwake-*.tgz kubectl-napwake-*.tar.gz krew-napwake.yaml sbom-*.spdx.json release/

      - name: Sign the release files' checksums
        working-directory: release
        run: |
          sha256sum -- * > ../checksums.txt
          cosign sign-blob --yes --bundle ../checksums.txt.sigstore.json ../checksums.txt

      - name: Attest the release files' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: checksums.txt

      # A draft left by an earlier, failed run of this release is replaced;
      # a published release never is.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "$TAG is already released" >&2
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi
          flags=(--draft --verify-tag --title "$TAG" --notes-file release-notes.md)
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          shopt -s nullglob
          reports=(vulnerabilities-*.txt)
          gh release create "$TAG" "${flags[@]}" release/* checksums.txt checksums.txt.sigstore.json "${reports[@]}"

      # From here on, users can install the release.
      - name: Tag the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: oras tag "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" "$TAG"

      # The chart's digest is read back from the registry: helm push's
      # output isn't an interface.
      - name: Push and sign the Helm chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          OWNER: ${{ github.repository_owner }}
        run: |
          charts="${REGISTRY}/${OWNER}/charts"
          helm push "napwake-${CHART_VERSION}.tgz" "oci://${charts}"
          digest=$(oras resolve "${charts}/napwake:${CHART_VERSION}")
          cosign sign --yes "${charts}/napwake@${digest}"

      - name: Tag the image latest
        if: steps.version.outputs.prerelease == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: oras tag "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" latest

      # Publishing a release, not a pre-release, moves releases/latest. The
      # docs workflow publishes the release's docs once this run succeeds.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false

  # brew install napwake/tap/kubectl-napwake installs the newest release,
  # so release candidates aren't brewed. The formula is written from the
  # published archives, the files brew downloads, and pushed to the tap with
  # a fine-grained token that can write only to it. The release is out by
  # now, so a missing token or a failure here leaves the tap on the last
  # release with a warning, and doesn't fail the run, whose success
  # publishes the docs.
  homebrew:
    name: Homebrew formula
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check for the tap's token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning title=Homebrew tap not updated::The HOMEBREW_TAP_TOKEN secret isn't set, so napwake/homebrew-tap stays on the last release. Add a fine-grained token with Contents read and write on that repository only, then re-run this job."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Write the formula from the release's archives
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "$TAG" --dir release \
            --pattern 'kubectl-napwake-darwin-*.tar.gz' --pattern 'kubectl-napwake-linux-*.tar.gz'
          go run ./hack/brewformula -tag "$TAG" -repo "$REPOSITORY" -dir release > kubectl-napwake.rb

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Push the formula to the tap
        if: steps.token.outputs.present == 'true'
        working-directory: tap
        run: |
          # Until the first stable release, release candidates are brewed, so
          # those trying them can install with Homebrew; after it, a release
          # candidate never replaces the stable release people install.
          formula=Formula/kubectl-napwake.rb
          if [[ "$TAG" == *-* ]] && [ -f "$formula" ] && ! grep -Eq '^ *version "[^"]+-' "$formula"; then
            echo "The tap has a stable release, which ${TAG#v}, a release candidate, doesn't replace"
            exit 0
          fi
          mkdir -p Formula
          cp ../kubectl-napwake.rb "$formula"
          git add "$formula"
          if git diff --cached --quiet; then
            echo "The tap already has kubectl-napwake ${TAG#v}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "kubectl-napwake ${TAG#v}"
          git push
