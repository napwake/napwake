name: Security

# Daily as well as on every change, so a vulnerability disclosed after a
# release is reported against main and the released image, not only the
# next pull request.
on:
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fails only on vulnerabilities Napwake's code reaches, not every
      # one in a module it imports.
      - run: make vulncheck

  image:
    name: Image vulnerabilities (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - env:
          PLATFORM: ${{ matrix.platform }}
        run: docker buildx build --platform "$PLATFORM" --load -t napwake:scan .
      # Fails on critical and high vulnerabilities with a fix available;
      # unfixed ones are reported, not blocking, so an upstream bug with no
      # fix can't hold up every pull request.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: napwake:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # The releases people install: the newest, a release candidate included,
  # and the latest stable one. Releases before 0.2.0 aren't scanned: 0.2.0
  # replaces them without an upgrade from them, and they get no fixes.
  releases:
    name: Releases to scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tags="$(gh release list --repo "$REPO" --exclude-drafts --limit 100 --json tagName,isPrerelease \
            --jq '[.[0].tagName, ([.[] | select(.isPrerelease | not)][0].tagName // empty)]
              | unique | map(select(test("^v0\\.[01]\\.") | not))')"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Scanning: $tags"

  # Each release's image, which runs the operator and the doorman both.
  released:
    name: Released image vulnerabilities (${{ matrix.tag }}, ${{ matrix.platform }})
    needs: releases
    if: needs.releases.outputs.tags != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.releases.outputs.tags) }}
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ matrix.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
