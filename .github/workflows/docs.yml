name: docs

# Publishes each release's docs as a version of the site, built from the
# tag, so its install commands name that release: a release to its minor,
# such as 0.2, and to latest, where the site's root goes, when it's the
# newest; a release candidate to next, with a banner saying so (see
# hack/docsite). Each is an Astro build of docs/, committed to the gh-pages
# branch, which GitHub Pages serves. It runs once the Release workflow
# succeeds, so a tag whose release failed publishes nothing. Run it
# manually, naming a release's tag, to republish that release's docs. A
# pull request only builds them, so a broken link, anchor or page fails it
# rather than the next release's docs.
on:
  pull_request:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose docs to publish, such as v0.2.0 or v0.2.0-rc.1
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'gh-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A required check on main, by this job's name.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: npm ci
        working-directory: docs

      # Fails on any broken link or anchor between the docs' pages. Mermaid
      # diagrams and the social cards are drawn with the runner's Chrome.
      - run: npm run build
        working-directory: docs

      # Every docs address the code, the chart and the README give lands
      # on a page and anchor of the built site, and the pages that answer
      # without a version keep the anchor they're opened with.
      - name: Check the docs addresses and redirects against the build
        env:
          NAPWAKE_DOCS_DIST: ${{ github.workspace }}/docs/dist
        run: go test -count=1 ./test/docs ./hack/docsite -run 'TestDocsAddressesLandInTheBuiltSite|TestBuiltSiteRedirectsKeepTheAnchor'

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the gh-pages branch
    env:
      # The Release workflow runs on tags only, so its run's branch is the tag.
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: npm ci
        working-directory: docs

      # The versions already published stay as they are, so the publish
      # starts from the branch, which doesn't exist before the first.
      - name: Check out the published site
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add -B gh-pages "$RUNNER_TEMP/gh-pages" origin/gh-pages
          else
            git worktree add --orphan -b gh-pages "$RUNNER_TEMP/gh-pages"
          fi

      - name: Publish the release's docs
        env:
          # Cloudflare Web Analytics' beacon on every published page, for
          # docs.napwake.dev's site. The token is public by design, in every
          # page's source. A pull request's build has none, so no beacon.
          PUBLIC_CF_BEACON_TOKEN: 48ee7e8b6c8d4e86b14263e5763a185f
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          go run ./hack/docsite -tag "$TAG" -site "$RUNNER_TEMP/gh-pages" -push
