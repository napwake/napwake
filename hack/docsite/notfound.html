<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - Hybernate</title>
<style>
  body { margin: 0; padding: 4rem 1rem; font: 16px/1.5 system-ui, sans-serif; color: #1f2328; background: #fff; text-align: center; }
  a { color: #0969da; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; }
    a { color: #4493f8; }
  }
</style>
<script>
  // A link without a version, such as /hybernate/guides/gitops/, predates
  // versioned docs or comes from the operator or the plugin: send it to the
  // same page in the root version. A missing page inside a version is a
  // real 404.
  (function () {
    var base = "{{js .Base}}";
    var root = "{{js .Root}}";
    if (location.pathname.indexOf(base) !== 0) return;
    var rest = location.pathname.slice(base.length);
    var first = rest.split("/")[0];
    if (first === root) return;
    fetch(base + "versions.json")
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; })
      .then(function (versions) {
        var versioned = versions.some(function (v) {
          return v.version === first || (v.aliases || []).indexOf(first) !== -1;
        });
        if (!versioned) location.replace(base + root + "/" + rest + location.search + location.hash);
      });
  })();
</script>
</head>
<body>
<h1>Page not found</h1>
<p>These docs have no such page. <a href="{{.Base}}">Go to the Hybernate docs</a>.</p>
</body>
</html>
